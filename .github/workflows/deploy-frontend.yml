# Frontend: npm ci + build (VITE_API_URL) → S3 (runbook Adım 19 sırası: asset'ler immutable,
# diğerleri 1 saat, index.html no-cache) → CloudFront invalidation. OIDC; repoda anahtar yok.
name: deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::API_URL repo değişkeni tanımlı değil"
            exit 1
          fi
          npm ci
          npm run build
          # Build'e gerçekten gömüldü mü (yanlış API'ye giden bir frontend yayınlanmasın)
          grep -rqF "$VITE_API_URL" dist/assets/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-frontend-${{ github.run_id }}
          mask-aws-account-id: true
      - name: S3'e yükle (önce asset'ler, en son index.html)
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        # Eski asset'ler bilerek silinmez: önbellekte eski index.html'i olan kullanıcılar ister.
        run: |
          aws s3 sync frontend/dist/assets "s3://${BUCKET}/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync frontend/dist "s3://${BUCKET}" --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=3600" --delete
          aws s3 cp frontend/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
      - name: CloudFront invalidation
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/" --query 'Invalidation.[Id,Status]' --output text
