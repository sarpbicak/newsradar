# NewsRadar API — yerelde ve EC2'de aynı: `docker compose up -d --build` (deploy/ içinden).
# Sırlar ve ayarlar deploy/.env'den gelir (repoya girmez; şablon: deploy/.env.example).
# Dışarıya YALNIZCA Caddy açılır (80/443); backend yalnızca iç ağda, Caddy'nin arkasında.
name: newsradar

# Caddy'nin sabit iç IP'si: backend'in X-Forwarded-For'una güvendiği TEK adres.
x-caddy-ip: &caddy_ip 172.28.0.10

services:
  backend:
    build:
      context: ../backend
    # EC2: ECR'daki image (BACKEND_IMAGE, SSM'den .env'ye); yerelde ../backend'den build edilir.
    image: ${BACKEND_IMAGE:-newsradar-api:local}
    env_file:
      - .env
    environment:
      NEWSRADAR_DB: /data/newsradar.db
      NEWSRADAR_TRUSTED_PROXY: caddy
      NEWSRADAR_CADDY_IP: *caddy_ip
    volumes:
      - data:/data
    networks:
      internal:
        ipv4_address: 172.28.0.20
    # Port YAYINLANMAZ (ports: yok) — erişim yalnızca Caddy üzerinden.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 20s

  caddy:
    image: caddy:2.11.7-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env içinde DOMAIN gerekli}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: *caddy_ip
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  data:          # SQLite (newsradar.db + WAL) — container yeniden yaratılsa da kalır
  caddy_data:    # TLS sertifikaları + ACME hesabı
  caddy_config:
