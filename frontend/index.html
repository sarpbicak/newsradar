<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: env(safe-area-inset-*) çalışsın (çentikli iPhone).
         maximum-scale/user-scalable KULLANILMAZ — erişilebilirliği bozar, modern iOS
         zaten yok sayar. iOS odak-zoom'u <16px input'tan gelir; CSS'te 16px ile çözülür.
         interactive-widget=resizes-content: Android Chrome'da klavye açılınca düzen alanı
         küçülür (dvh ve sabit öğeler klavyenin üstünde kalır); iOS bunu yok sayar → Modal
         visualViewport ile çözer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>NewsRadar — Haber Akışı Bazlı Risk Analizi</title>
    <!-- Favicon: header'daki radar ikonu, sitenin ana rengi (accent #1E3A5F). SVG koyu
         temada kendi rengini açar (prefers-color-scheme); ICO eski tarayıcılar için. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F7F5F1" />
    <!-- Tema, ilk boyamadan ÖNCE (CSS ve React'ten önce) uygulanır → yanlış tema flaşı yok.
         Mantık src/theme.js ile aynı (anahtar nr_theme: system | light | dark). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("nr_theme");
          var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0D0D0B" : "#F7F5F1");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
