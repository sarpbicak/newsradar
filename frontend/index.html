<html lang="tr">
  <head>

    <!-- viewport-fit=cover: env(safe-area-inset-*) çalışsın (çentikli iPhone).
         maximum-scale/user-scalable KULLANILMAZ — erişilebilirliği bozar, modern iOS
         zaten yok sayar. iOS odak-zoom'u <16px input'tan gelir; CSS'te 16px ile çözülür. -->

         temada kendi rengini açar (prefers-color-scheme); ICO eski tarayıcılar için. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1E3A5F" />
  </head>
