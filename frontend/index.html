<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: env(safe-area-inset-*) çalışsın (çentikli iPhone).
         maximum-scale/user-scalable KULLANILMAZ — erişilebilirliği bozar, modern iOS
         zaten yok sayar. iOS odak-zoom'u <16px input'tan gelir; CSS'te 16px ile çözülür.
         interactive-widget=resizes-content: Android Chrome'da klavye açılınca düzen alanı
         küçülür (dvh ve sabit öğeler klavyenin üstünde kalır); iOS bunu yok sayar → Modal
         visualViewport ile çözer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>NewsRadar · Şirket haberlerinin kısa değerlendirmesi</title>
    <!-- Favicon: header'daki radar ikonu, sitenin ana rengi (camgöbeği accent: açık #0E7490, koyu #22D3EE). SVG koyu
         temada kendi rengini açar (prefers-color-scheme); ICO eski tarayıcılar için. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F7F8FA" />
    <!-- Tema, ilk boyamadan ÖNCE (CSS ve React'ten önce) uygulanır → yanlış tema flaşı yok.
         Mantık src/theme.js ile aynı (anahtar nr_theme: system | light | dark). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("nr_theme");
          var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0B0F14" : "#F7F8FA");
        } catch (e) {}
        // Dokunmatik landing belirmeleri: gizli başlangıç hali ilk boyamadan önce CSS'te
        // (index.css .lx-reveal). Sorgu scroll.js LENIS_MQ'nun tersi; motor gelmezse kaldırılır.
        try {
          if (!window.matchMedia("(min-width: 1024px) and (pointer: fine)").matches && !window.matchMedia("(prefers-reduced-motion: reduce)").matches)
            document.documentElement.classList.add("lx-reveal");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
